<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字典管理 - 系统管理</title>

    <!-- 1. 先加载 Tailwind CSS v4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. 再加载 Element Plus CSS（确保在 Tailwind 之后，优先级更高） -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">

    <!-- 3. Vue 3 & Element Plus JS -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>

    <!-- 4. 冲突修复样式（必须在 Element Plus CSS 之后） -->
    <style>
        /* ================================================================
         * Tailwind Preflight 冲突修复
         * 这些规则覆盖 Tailwind 对 Element Plus 组件的破坏性重置
         * ================================================================ */

        /* 修复按钮：Tailwind 将 button 背景设为 transparent */
        .el-button {
            background-color: initial;
        }
        .el-button--primary {
            background-color: var(--el-color-primary);
        }
        .el-button--success {
            background-color: var(--el-color-success);
        }
        .el-button--danger {
            background-color: var(--el-color-danger);
        }
        .el-button--warning {
            background-color: var(--el-color-warning);
        }
        .el-button--info {
            background-color: var(--el-color-info);
        }
        .el-button.is-link,
        .el-button.is-text {
            background-color: transparent;
        }

        /* 修复输入框：Tailwind 重置了 input 的边框和样式 */
        .el-input__inner,
        .el-textarea__inner {
            border-width: 1px;
            border-style: solid;
            border-color: var(--el-input-border-color, var(--el-border-color));
            background-color: var(--el-input-bg-color, var(--el-fill-color-blank));
            font-family: inherit;
            line-height: var(--el-input-inner-height);
        }
        .el-input__inner:focus,
        .el-textarea__inner:focus {
            border-color: var(--el-input-focus-border-color, var(--el-color-primary));
        }

        /* 修复数字输入框 */
        .el-input-number .el-input__inner {
            text-align: left;
            line-height: var(--el-input-inner-height);
        }

        /* 修复单选框 */
        .el-radio__input.is-checked .el-radio__inner {
            background-color: var(--el-color-primary);
            border-color: var(--el-color-primary);
        }

        /* 修复表格行选中态 */
        .el-table__row {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .el-table__row:hover {
            background-color: var(--el-fill-color-light) !important;
        }
        .el-table__row.current-row {
            background-color: var(--el-color-primary-light-9) !important;
        }

        /* 修复图标对齐（Tailwind 将 svg 设为 display: block） */
        .el-icon svg,
        .el-button .el-icon svg {
            display: inline-block;
            vertical-align: middle;
        }

        /* 修复弹窗圆角 */
        .el-dialog {
            border-radius: 12px;
            overflow: hidden;
        }
        .el-dialog__header {
            border-bottom: 1px solid var(--el-border-color-lighter);
            padding: 16px 20px;
            margin-right: 0;
        }
        .el-dialog__body {
            padding: 20px;
        }
        .el-dialog__footer {
            border-top: 1px solid var(--el-border-color-lighter);
            padding: 12px 20px;
        }

        /* 修复分页器 */
        .el-pagination.is-background .btn-prev,
        .el-pagination.is-background .btn-next,
        .el-pagination.is-background .el-pager li {
            background-color: var(--el-fill-color);
        }

        /* 全局基础 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c0c4cc; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #909399; }

        /* 搜索表单紧凑布局 */
        .search-form .el-form-item {
            margin-bottom: 0 !important;
        }

        /* 按钮微交互 */
        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: scale(1.03);
        }

        /* 标签微交互 */
        .tag-hover {
            transition: all 0.2s ease;
        }
        .tag-hover:hover {
            transform: scale(1.05);
        }

        /* 卡片阴影 */
        .card-shadow {
            box-shadow: 0 1px 4px rgba(0,0,0,0.04), 0 0 6px rgba(0,0,0,0.02);
            transition: box-shadow 0.3s ease;
        }
        .card-shadow:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        /* 响应式：小屏幕上下布局 */
        @media (max-width: 1023px) {
            .dict-layout { flex-direction: column !important; }
            .dict-left, .dict-right { width: 100% !important; height: 50% !important; }
        }
    </style>
</head>
<body>
<div id="app" class="h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <header class="h-14 bg-white border-b border-gray-200 flex items-center px-6 justify-between flex-shrink-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center">
                <el-icon color="white" size="18"><collection /></el-icon>
            </div>
            <h1 class="text-lg font-semibold text-gray-800">字典管理</h1>
            <el-tag size="small" type="info" effect="plain" class="ml-2">系统管理</el-tag>
        </div>
        <div class="flex items-center gap-4">
            <el-breadcrumb separator="/">
                <el-breadcrumb-item>首页</el-breadcrumb-item>
                <el-breadcrumb-item>系统管理</el-breadcrumb-item>
                <el-breadcrumb-item>字典管理</el-breadcrumb-item>
            </el-breadcrumb>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-1 p-4 overflow-hidden">
        <div class="dict-layout flex gap-4 h-full">

            <!-- ========== 左侧：字典类型 ========== -->
            <div class="dict-left w-full lg:w-[38%] xl:w-[35%] flex flex-col bg-white rounded-xl card-shadow border border-gray-100 overflow-hidden">
                <!-- 头部 -->
                <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between flex-shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="w-1 h-5 bg-blue-500 rounded-full"></div>
                        <h2 class="text-base font-semibold text-gray-800">字典类型</h2>
                        <el-tag size="small" type="info" effect="light" class="ml-1">{{ typeTotal }} 条</el-tag>
                    </div>
                    <div class="flex gap-2">
                        <el-button type="primary" size="small" :icon="Plus" @click="openTypeAdd" class="btn-hover">
                            新增
                        </el-button>
                        <el-button size="small" :icon="Refresh" @click="refreshCache" class="btn-hover">
                            刷新缓存
                        </el-button>
                    </div>
                </div>

                <!-- 搜索区 -->
                <div class="px-5 py-3 bg-gray-50/60 border-b border-gray-100 flex-shrink-0">
                    <el-form :model="typeQuery" inline class="search-form">
                        <el-form-item>
                            <el-input v-model="typeQuery.dictName" placeholder="字典名称" clearable size="small" class="w-36" @keyup.enter="handleTypeSearch">
                                <template #prefix><el-icon><search /></el-icon></template>
                            </el-input>
                        </el-form-item>
                        <el-form-item>
                            <el-input v-model="typeQuery.dictType" placeholder="字典类型" clearable size="small" class="w-36" @keyup.enter="handleTypeSearch">
                                <template #prefix><el-icon><document /></el-icon></template>
                            </el-input>
                        </el-form-item>
                        <el-form-item>
                            <el-button type="primary" size="small" :icon="Search" @click="handleTypeSearch">查询</el-button>
                            <el-button size="small" :icon="RefreshRight" @click="handleTypeReset">重置</el-button>
                        </el-form-item>
                    </el-form>
                </div>

                <!-- 表格 -->
                <div class="flex-1 overflow-hidden p-3">
                    <el-table
                            v-loading="typeLoading"
                            :data="typeList"
                            highlight-current-row
                            stripe
                            size="small"
                            class="w-full h-full"
                            @row-click="handleSelectType"
                            empty-text="暂无字典类型"
                    >
                        <el-table-column prop="dictId" label="主键" width="70" align="center" />
                        <el-table-column prop="dictName" label="字典名称" min-width="120" show-overflow-tooltip>
                            <template #default="{ row }">
                                <div class="flex items-center gap-2">
                                    <el-icon class="text-blue-400"><collection-tag /></el-icon>
                                    <span class="font-medium text-gray-700">{{ row.dictName }}</span>
                                </div>
                            </template>
                        </el-table-column>
                        <el-table-column prop="dictType" label="字典类型" min-width="160" show-overflow-tooltip>
                            <template #default="{ row }">
                                <code class="text-xs bg-gray-100 px-2 py-0.5 rounded text-gray-600 font-mono">{{ row.dictType }}</code>
                            </template>
                        </el-table-column>
                        <el-table-column prop="createTime" label="创建时间" width="110" align="center" />
                        <el-table-column label="操作" width="130" align="center" fixed="right">
                            <template #default="{ row }">
                                <div class="flex items-center justify-center gap-1">
                                    <el-button link type="primary" size="small" :icon="Edit" @click.stop="openTypeEdit(row)" class="btn-hover">编辑</el-button>
                                    <el-popconfirm title="确定删除该字典类型吗？" confirm-button-text="确定" cancel-button-text="取消" @confirm="handleTypeDelete(row)">
                                        <template #reference>
                                            <el-button link type="danger" size="small" :icon="Delete" class="btn-hover">删除</el-button>
                                        </template>
                                    </el-popconfirm>
                                </div>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>

                <!-- 分页 -->
                <div class="px-4 py-3 border-t border-gray-100 flex justify-end flex-shrink-0">
                    <el-pagination
                            v-model:current-page="typeQuery.pageNo"
                            v-model:page-size="typeQuery.pageSize"
                            :total="typeTotal"
                            :page-sizes="[10, 20, 50]"
                            layout="total, sizes, prev, pager, next"
                            size="small"
                            background
                    />
                </div>
            </div>

            <!-- ========== 右侧：字典数据 ========== -->
            <div class="dict-right w-full lg:w-[62%] xl:w-[65%] flex flex-col bg-white rounded-xl card-shadow border border-gray-100 overflow-hidden">
                <!-- 头部 -->
                <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between flex-shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="w-1 h-5 bg-emerald-500 rounded-full"></div>
                        <h2 class="text-base font-semibold text-gray-800">字典数据</h2>
                        <el-tag v-if="selectedType" type="success" size="small" effect="light" class="ml-1 font-mono tag-hover">
                            <el-icon class="mr-1"><collection /></el-icon>
                            {{ selectedType.dictName }} ({{ selectedType.dictType }})
                        </el-tag>
                        <el-tag v-else type="info" size="small" effect="light" class="ml-1">
                            <el-icon class="mr-1"><warning /></el-icon>
                            请先选择左侧字典类型
                        </el-tag>
                    </div>
                    <el-button type="primary" size="small" :icon="Plus" :disabled="!selectedType" @click="openItemAdd" class="btn-hover">
                        新增数据
                    </el-button>
                </div>

                <!-- 搜索区 -->
                <div class="px-5 py-3 bg-gray-50/60 border-b border-gray-100 flex-shrink-0">
                    <el-form :model="itemQuery" inline class="search-form">
                        <el-form-item>
                            <el-input v-model="itemQuery.dictLabel" placeholder="字典标签" clearable size="small" class="w-36" @keyup.enter="handleItemSearch">
                                <template #prefix><el-icon><price-tag /></el-icon></template>
                            </el-input>
                        </el-form-item>
                        <el-form-item>
                            <el-input v-model="itemQuery.dictValue" placeholder="字典键值" clearable size="small" class="w-36" @keyup.enter="handleItemSearch">
                                <template #prefix><el-icon><key /></el-icon></template>
                            </el-input>
                        </el-form-item>
                        <el-form-item>
                            <el-select v-model="itemQuery.status" placeholder="状态" clearable size="small" class="w-28">
                                <el-option label="正常" value="0">
                                    <el-tag type="success" size="small">正常</el-tag>
                                </el-option>
                                <el-option label="停用" value="1">
                                    <el-tag type="danger" size="small">停用</el-tag>
                                </el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item>
                            <el-button type="primary" size="small" :icon="Search" @click="handleItemSearch">查询</el-button>
                            <el-button size="small" :icon="RefreshRight" @click="handleItemReset">重置</el-button>
                        </el-form-item>
                    </el-form>
                </div>

                <!-- 表格 -->
                <div class="flex-1 overflow-hidden p-3">
                    <el-table
                            v-loading="itemLoading"
                            :data="itemList"
                            stripe
                            size="small"
                            class="w-full h-full"
                            empty-text="该类型下暂无字典数据"
                    >
                        <el-table-column prop="dictItemId" label="主键" width="70" align="center" />
                        <el-table-column prop="dictLabel" label="字典标签" min-width="100" show-overflow-tooltip>
                            <template #default="{ row }">
                                <span class="font-medium text-gray-700">{{ row.dictLabel }}</span>
                            </template>
                        </el-table-column>
                        <el-table-column prop="dictValue" label="键值" width="90" align="center">
                            <template #default="{ row }">
                                <code class="text-xs bg-gray-100 px-1.5 py-0.5 rounded text-gray-600 font-mono">{{ row.dictValue }}</code>
                            </template>
                        </el-table-column>
                        <el-table-column prop="sortOrder" label="排序" width="70" align="center">
                            <template #default="{ row }">
                                <el-tag size="small" type="warning" effect="plain">{{ row.sortOrder }}</el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="status" label="状态" width="80" align="center">
                            <template #default="{ row }">
                                <el-tag :type="row.status === '0' ? 'success' : 'danger'" size="small" effect="light" class="tag-hover">
                                    {{ row.status === '0' ? '正常' : '停用' }}
                                </el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="remark" label="备注" min-width="120" show-overflow-tooltip />
                        <el-table-column prop="createTime" label="创建时间" width="110" align="center" />
                        <el-table-column label="操作" width="130" align="center" fixed="right">
                            <template #default="{ row }">
                                <div class="flex items-center justify-center gap-1">
                                    <el-button link type="primary" size="small" :icon="Edit" @click="openItemEdit(row)" class="btn-hover">编辑</el-button>
                                    <el-popconfirm title="确定删除该字典数据吗？" confirm-button-text="确定" cancel-button-text="取消" @confirm="handleItemDelete(row)">
                                        <template #reference>
                                            <el-button link type="danger" size="small" :icon="Delete" class="btn-hover">删除</el-button>
                                        </template>
                                    </el-popconfirm>
                                </div>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>

                <!-- 分页 -->
                <div class="px-4 py-3 border-t border-gray-100 flex justify-end flex-shrink-0">
                    <el-pagination
                            v-model:current-page="itemQuery.pageNo"
                            v-model:page-size="itemQuery.pageSize"
                            :total="itemTotal"
                            :page-sizes="[10, 20, 50]"
                            layout="total, sizes, prev, pager, next"
                            size="small"
                            background
                    />
                </div>
            </div>
        </div>
    </main>

    <!-- ========== 字典类型编辑弹窗 ========== -->
    <el-dialog
            v-model="typeModalVisible"
            :title="typeEditData ? '编辑字典类型' : '新增字典类型'"
            width="520px"
            :close-on-click-modal="false"
            destroy-on-close
            align-center
    >
        <el-form ref="typeFormRef" :model="typeForm" :rules="typeRules" label-width="90px" class="px-2">
            <el-form-item label="字典名称" prop="dictName">
                <el-input
                        v-model="typeForm.dictName"
                        placeholder="请输入字典名称"
                        maxlength="50"
                        show-word-limit
                        clearable
                >
                    <template #prefix><el-icon><collection-tag /></el-icon></template>
                </el-input>
            </el-form-item>
            <el-form-item label="字典类型" prop="dictType">
                <el-input
                        v-model="typeForm.dictType"
                        placeholder="请输入字典类型（如：sys_user_sex）"
                        maxlength="100"
                        show-word-limit
                        :disabled="!!typeEditData"
                        clearable
                >
                    <template #prefix><el-icon><document /></el-icon></template>
                    <template #append>
                        <el-tooltip content="字典类型的唯一标识，建议使用小写字母、数字和下划线" placement="top">
                            <el-icon class="cursor-help text-gray-400 hover:text-blue-500 transition-colors"><question-filled /></el-icon>
                        </el-tooltip>
                    </template>
                </el-input>
            </el-form-item>
            <el-form-item label="备注" prop="remark">
                <el-input
                        v-model="typeForm.remark"
                        type="textarea"
                        :rows="3"
                        placeholder="请输入备注信息"
                        maxlength="200"
                        show-word-limit
                        resize="none"
                />
            </el-form-item>
        </el-form>
        <template #footer>
            <div class="flex justify-end gap-3">
                <el-button @click="typeModalVisible = false" class="btn-hover">取 消</el-button>
                <el-button type="primary" :loading="typeSubmitLoading" @click="handleTypeSubmit" class="btn-hover">确 定</el-button>
            </div>
        </template>
    </el-dialog>

    <!-- ========== 字典数据编辑弹窗 ========== -->
    <el-dialog
            v-model="itemModalVisible"
            :title="itemEditData ? '编辑字典数据' : '新增字典数据'"
            width="520px"
            :close-on-click-modal="false"
            destroy-on-close
            align-center
    >
        <el-form ref="itemFormRef" :model="itemForm" :rules="itemRules" label-width="90px" class="px-2">
            <el-form-item label="字典类型">
                <el-tag type="info" size="large" effect="plain" class="font-mono text-sm">
                    <el-icon class="mr-1"><collection /></el-icon>
                    {{ currentDictType || '未选择' }}
                </el-tag>
            </el-form-item>
            <el-form-item label="字典标签" prop="dictLabel">
                <el-input
                        v-model="itemForm.dictLabel"
                        placeholder="请输入字典标签（如：男）"
                        maxlength="50"
                        show-word-limit
                        clearable
                >
                    <template #prefix><el-icon><price-tag /></el-icon></template>
                </el-input>
            </el-form-item>
            <el-form-item label="字典键值" prop="dictValue">
                <el-input
                        v-model="itemForm.dictValue"
                        placeholder="请输入字典键值（如：0）"
                        maxlength="100"
                        show-word-limit
                        clearable
                >
                    <template #prefix><el-icon><key /></el-icon></template>
                </el-input>
            </el-form-item>
            <el-form-item label="显示排序" prop="sortOrder">
                <el-input-number v-model="itemForm.sortOrder" :min="0" :max="9999" controls-position="right" class="w-full" />
            </el-form-item>
            <el-form-item label="状态" prop="status">
                <el-radio-group v-model="itemForm.status">
                    <el-radio label="0">
                        <el-tag type="success" size="small" effect="light">正常</el-tag>
                    </el-radio>
                    <el-radio label="1">
                        <el-tag type="danger" size="small" effect="light">停用</el-tag>
                    </el-radio>
                </el-radio-group>
            </el-form-item>
            <el-form-item label="备注" prop="remark">
                <el-input
                        v-model="itemForm.remark"
                        type="textarea"
                        :rows="3"
                        placeholder="请输入备注信息"
                        maxlength="200"
                        show-word-limit
                        resize="none"
                />
            </el-form-item>
        </el-form>
        <template #footer>
            <div class="flex justify-end gap-3">
                <el-button @click="itemModalVisible = false" class="btn-hover">取 消</el-button>
                <el-button type="primary" :loading="itemSubmitLoading" @click="handleItemSubmit" class="btn-hover">确 定</el-button>
            </div>
        </template>
    </el-dialog>
</div>

<script>
    const { createApp, ref, reactive, computed, onMounted } = Vue;
    const { ElMessage } = ElementPlus;

    const app = createApp({
        setup() {
            const {
                Plus, Search, Refresh, RefreshRight, Edit, Delete,
                Collection, CollectionTag, Document, Warning, PriceTag, Key, QuestionFilled
            } = ElementPlusIconsVue;

            // ========== 模拟数据 ==========
            const mockTypeList = [
                { dictId: 1, dictName: '通用状态', dictType: 'sys_normal_status', remark: '系统通用状态字典', createTime: '2023-01-01' },
                { dictId: 2, dictName: '显示状态', dictType: 'sys_show_status', remark: '控制页面元素显示隐藏', createTime: '2023-01-01' },
                { dictId: 3, dictName: '用户性别', dictType: 'sys_user_sex', remark: '用户性别选项', createTime: '2023-01-02' },
                { dictId: 4, dictName: '通知类型', dictType: 'sys_notice_type', remark: '系统通知类型', createTime: '2023-01-03' },
                { dictId: 5, dictName: '操作类型', dictType: 'sys_oper_type', remark: '系统操作日志类型', createTime: '2023-01-04' },
                { dictId: 6, dictName: '用户状态', dictType: 'sys_user_status', remark: '用户账号状态', createTime: '2023-01-05' },
                { dictId: 7, dictName: '菜单类型', dictType: 'sys_menu_type', remark: '菜单目录类型', createTime: '2023-01-06' },
                { dictId: 8, dictName: '是否删除', dictType: 'sys_yes_no', remark: '逻辑删除标记', createTime: '2023-01-07' },
            ];

            const mockItemMap = {
                'sys_normal_status': [
                    { dictItemId: 1, dictType: 'sys_normal_status', dictLabel: '正常', dictValue: '0', sortOrder: 1, status: '0', remark: '', createTime: '2023-01-01' },
                    { dictItemId: 2, dictType: 'sys_normal_status', dictLabel: '停用', dictValue: '1', sortOrder: 2, status: '0', remark: '', createTime: '2023-01-01' },
                ],
                'sys_show_status': [
                    { dictItemId: 3, dictType: 'sys_show_status', dictLabel: '显示', dictValue: '0', sortOrder: 1, status: '0', remark: '', createTime: '2023-01-01' },
                    { dictItemId: 4, dictType: 'sys_show_status', dictLabel: '隐藏', dictValue: '1', sortOrder: 2, status: '0', remark: '', createTime: '2023-01-01' },
                ],
                'sys_user_sex': [
                    { dictItemId: 5, dictType: 'sys_user_sex', dictLabel: '男', dictValue: '0', sortOrder: 1, status: '0', remark: '', createTime: '2023-01-02' },
                    { dictItemId: 6, dictType: 'sys_user_sex', dictLabel: '女', dictValue: '1', sortOrder: 2, status: '0', remark: '', createTime: '2023-01-02' },
                    { dictItemId: 7, dictType: 'sys_user_sex', dictLabel: '未知', dictValue: '2', sortOrder: 3, status: '0', remark: '', createTime: '2023-01-02' },
                ],
                'sys_notice_type': [
                    { dictItemId: 8, dictType: 'sys_notice_type', dictLabel: '通知', dictValue: '1', sortOrder: 1, status: '0', remark: '', createTime: '2023-01-03' },
                    { dictItemId: 9, dictType: 'sys_notice_type', dictLabel: '公告', dictValue: '2', sortOrder: 2, status: '0', remark: '', createTime: '2023-01-03' },
                ],
                'sys_oper_type': [
                    { dictItemId: 10, dictType: 'sys_oper_type', dictLabel: '新增', dictValue: '1', sortOrder: 1, status: '0', remark: '', createTime: '2023-01-04' },
                    { dictItemId: 11, dictType: 'sys_oper_type', dictLabel: '修改', dictValue: '2', sortOrder: 2, status: '0', remark: '', createTime: '2023-01-04' },
                    { dictItemId: 12, dictType: 'sys_oper_type', dictLabel: '删除', dictValue: '3', sortOrder: 3, status: '0', remark: '', createTime: '2023-01-04' },
                    { dictItemId: 13, dictType: 'sys_oper_type', dictLabel: '查询', dictValue: '4', sortOrder: 4, status: '0', remark: '', createTime: '2023-01-04' },
                ],
                'sys_user_status': [
                    { dictItemId: 14, dictType: 'sys_user_status', dictLabel: '正常', dictValue: '0', sortOrder: 1, status: '0', remark: '', createTime: '2023-01-05' },
                    { dictItemId: 15, dictType: 'sys_user_status', dictLabel: '停用', dictValue: '1', sortOrder: 2, status: '0', remark: '', createTime: '2023-01-05' },
                    { dictItemId: 16, dictType: 'sys_user_status', dictLabel: '锁定', dictValue: '2', sortOrder: 3, status: '1', remark: '', createTime: '2023-01-05' },
                ],
                'sys_menu_type': [
                    { dictItemId: 17, dictType: 'sys_menu_type', dictLabel: '目录', dictValue: 'M', sortOrder: 1, status: '0', remark: '', createTime: '2023-01-06' },
                    { dictItemId: 18, dictType: 'sys_menu_type', dictLabel: '菜单', dictValue: 'C', sortOrder: 2, status: '0', remark: '', createTime: '2023-01-06' },
                    { dictItemId: 19, dictType: 'sys_menu_type', dictLabel: '按钮', dictValue: 'F', sortOrder: 3, status: '0', remark: '', createTime: '2023-01-06' },
                ],
                'sys_yes_no': [
                    { dictItemId: 20, dictType: 'sys_yes_no', dictLabel: '是', dictValue: 'Y', sortOrder: 1, status: '0', remark: '', createTime: '2023-01-07' },
                    { dictItemId: 21, dictType: 'sys_yes_no', dictLabel: '否', dictValue: 'N', sortOrder: 2, status: '0', remark: '', createTime: '2023-01-07' },
                ],
            };

            // ========== 左侧：字典类型 ==========
            const typeLoading = ref(false);
            const typeList = ref([]);
            const typeTotal = ref(0);
            const typeQuery = reactive({ pageNo: 1, pageSize: 10, dictName: '', dictType: '' });
            const selectedType = ref(null);

            // ========== 右侧：字典数据 ==========
            const itemLoading = ref(false);
            const itemList = ref([]);
            const itemTotal = ref(0);
            const itemQuery = reactive({ pageNo: 1, pageSize: 10, dictType: '', dictLabel: '', dictValue: '', status: '' });
            const currentDictType = computed(() => selectedType.value?.dictType || '');

            // ========== 类型弹窗 ==========
            const typeModalVisible = ref(false);
            const typeEditData = ref(null);
            const typeSubmitLoading = ref(false);
            const typeFormRef = ref(null);
            const typeForm = reactive({ dictId: null, dictName: '', dictType: '', remark: '' });
            const typeRules = {
                dictName: [{ required: true, message: '字典名称不能为空', trigger: 'blur' }, { min: 1, max: 50, message: '长度 1-50 字符', trigger: 'blur' }],
                dictType: [{ required: true, message: '字典类型不能为空', trigger: 'blur' }, { pattern: /^[a-z][a-z0-9_]*$/, message: '小写字母开头，仅允许小写、数字和下划线', trigger: 'blur' }],
            };

            // ========== 数据弹窗 ==========
            const itemModalVisible = ref(false);
            const itemEditData = ref(null);
            const itemSubmitLoading = ref(false);
            const itemFormRef = ref(null);
            const itemForm = reactive({ dictItemId: null, dictType: '', dictLabel: '', dictValue: '', sortOrder: 0, status: '0', remark: '' });
            const itemRules = {
                dictLabel: [{ required: true, message: '字典标签不能为空', trigger: 'blur' }],
                dictValue: [{ required: true, message: '字典键值不能为空', trigger: 'blur' }],
            };

            // ========== 方法 ==========
            function loadTypeList() {
                typeLoading.value = true;
                setTimeout(() => {
                    let list = [...mockTypeList];
                    if (typeQuery.dictName) list = list.filter(t => t.dictName.includes(typeQuery.dictName));
                    if (typeQuery.dictType) list = list.filter(t => t.dictType.includes(typeQuery.dictType));
                    const start = (typeQuery.pageNo - 1) * typeQuery.pageSize;
                    typeList.value = list.slice(start, start + typeQuery.pageSize);
                    typeTotal.value = list.length;
                    typeLoading.value = false;
                    if (typeList.value.length > 0 && !selectedType.value) {
                        handleSelectType(typeList.value[0]);
                    }
                }, 300);
            }

            function handleTypeSearch() { typeQuery.pageNo = 1; loadTypeList(); }
            function handleTypeReset() { typeQuery.dictName = ''; typeQuery.dictType = ''; typeQuery.pageNo = 1; loadTypeList(); }

            function handleSelectType(row) {
                selectedType.value = row;
                itemQuery.dictType = row.dictType;
                itemQuery.pageNo = 1;
                itemQuery.dictLabel = '';
                itemQuery.dictValue = '';
                itemQuery.status = '';
                loadItemList();
            }

            function loadItemList() {
                if (!currentDictType.value) return;
                itemLoading.value = true;
                setTimeout(() => {
                    let list = [...(mockItemMap[currentDictType.value] || [])];
                    if (itemQuery.dictLabel) list = list.filter(i => i.dictLabel.includes(itemQuery.dictLabel));
                    if (itemQuery.dictValue) list = list.filter(i => i.dictValue.includes(itemQuery.dictValue));
                    if (itemQuery.status !== '') list = list.filter(i => i.status === itemQuery.status);
                    list.sort((a, b) => a.sortOrder - b.sortOrder);
                    const start = (itemQuery.pageNo - 1) * itemQuery.pageSize;
                    itemList.value = list.slice(start, start + itemQuery.pageSize);
                    itemTotal.value = list.length;
                    itemLoading.value = false;
                }, 300);
            }

            function handleItemSearch() { itemQuery.pageNo = 1; loadItemList(); }
            function handleItemReset() { itemQuery.dictLabel = ''; itemQuery.dictValue = ''; itemQuery.status = ''; itemQuery.pageNo = 1; loadItemList(); }

            function openTypeAdd() {
                typeEditData.value = null;
                typeForm.dictId = null; typeForm.dictName = ''; typeForm.dictType = ''; typeForm.remark = '';
                typeModalVisible.value = true;
            }

            function openTypeEdit(row) {
                typeEditData.value = row;
                typeForm.dictId = row.dictId; typeForm.dictName = row.dictName; typeForm.dictType = row.dictType; typeForm.remark = row.remark;
                typeModalVisible.value = true;
            }

            function handleTypeDelete(row) {
                ElMessage.success(`字典类型「${row.dictName}」删除成功`);
                loadTypeList();
            }

            function handleTypeSubmit() {
                typeFormRef.value?.validate(valid => {
                    if (!valid) return;
                    typeSubmitLoading.value = true;
                    setTimeout(() => {
                        typeSubmitLoading.value = false;
                        ElMessage.success(typeEditData.value ? '修改成功' : '新增成功');
                        typeModalVisible.value = false;
                        loadTypeList();
                    }, 500);
                });
            }

            function openItemAdd() {
                if (!selectedType.value) { ElMessage.warning('请先选择字典类型'); return; }
                itemEditData.value = null;
                itemForm.dictItemId = null; itemForm.dictType = currentDictType.value; itemForm.dictLabel = '';
                itemForm.dictValue = ''; itemForm.sortOrder = 0; itemForm.status = '0'; itemForm.remark = '';
                itemModalVisible.value = true;
            }

            function openItemEdit(row) {
                itemEditData.value = row;
                itemForm.dictItemId = row.dictItemId; itemForm.dictType = row.dictType; itemForm.dictLabel = row.dictLabel;
                itemForm.dictValue = row.dictValue; itemForm.sortOrder = row.sortOrder; itemForm.status = row.status; itemForm.remark = row.remark;
                itemModalVisible.value = true;
            }

            function handleItemDelete(row) {
                ElMessage.success(`字典数据「${row.dictLabel}」删除成功`);
                loadItemList();
            }

            function handleItemSubmit() {
                itemFormRef.value?.validate(valid => {
                    if (!valid) return;
                    itemSubmitLoading.value = true;
                    setTimeout(() => {
                        itemSubmitLoading.value = false;
                        ElMessage.success(itemEditData.value ? '修改成功' : '新增成功');
                        itemModalVisible.value = false;
                        loadItemList();
                    }, 500);
                });
            }

            function refreshCache() { ElMessage.success('字典缓存刷新成功'); }

            onMounted(() => { loadTypeList(); });

            return {
                Plus, Search, Refresh, RefreshRight, Edit, Delete,
                Collection, CollectionTag, Document, Warning, PriceTag, Key, QuestionFilled,
                typeLoading, typeList, typeTotal, typeQuery, selectedType,
                itemLoading, itemList, itemTotal, itemQuery, currentDictType,
                typeModalVisible, typeEditData, typeSubmitLoading, typeFormRef, typeForm, typeRules,
                itemModalVisible, itemEditData, itemSubmitLoading, itemFormRef, itemForm, itemRules,
                handleTypeSearch, handleTypeReset, handleSelectType,
                handleItemSearch, handleItemReset,
                openTypeAdd, openTypeEdit, handleTypeDelete, handleTypeSubmit,
                openItemAdd, openItemEdit, handleItemDelete, handleItemSubmit,
                refreshCache,
            };
        }
    });

    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
        app.component(key, component);
    }
    app.use(ElementPlus);
    app.mount('#app');
</script>
</body>
</html>
